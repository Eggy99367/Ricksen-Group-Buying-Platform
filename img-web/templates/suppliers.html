<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>供應商管理</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            border: 1px solid #000;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header button {
            padding: 10px;
            font-size: 16px;
        }
        .table-container {
            border: 1px solid #000;
            height: 300px;
            overflow-y: auto;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th, .table-container td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button onclick="location.href='/'">回主頁</button>
            <div>
                <button>編輯</button>
                <button>新增</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>供應商編號</th>
                        <th>供應商名稱</th>
                        <th>統一編號</th>
                        <th>聯絡人</th>
                        <th>聯絡電話</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>商品A</td>
                        <td>100</td>
                        <td>10</td>
                        <td>這是一個商品描述</td>
                    </tr>
                    <tr>
                        <td>商品B</td>
                        <td>200</td>
                        <td>20</td>
                        <td>這是一個商品描述</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
